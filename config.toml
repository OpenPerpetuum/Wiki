# i18n: default language. Adding a language = add a [translations.<lang>]
# block (or per-locale content under content/<lang>/), fill ui.* for that
# locale, and regenerate the search index for it (see generator README).
default_language = "en"
title = "Open Perpetuum Wiki"
description = "Player and developer reference for the Open Perpetuum server: what you can do in the game, entity stats, zone generation, and stat field semantics."
# GitHub Pages: set the repo Pages URL once the site is published, e.g.
# base_url = "https://<user>.github.io/<repo>/wiki"
base_url = "/"
generate_feeds = false
# Search is a lightweight client-side script (search.js + search_index.json
# template) instead of the elasticlunr index.
build_search_index = false
generate_sitemap = true

[markdown]
smart_punctuation = false


[extra]
# reserved (e.g. server name, build date injected by CI)

# UI strings live here so the templates contain no hardcoded copy — the
# i18n seam. A new language adds a parallel ui_<lang> table (or moves this
# into Zola [translations]); the chrome reads `config.extra.ui`, and the
# inline JS receives it via window.WIKI_UI.
[extra.ui]
