# Builds the Zola static site and deploys it to GitHub Pages.
# Generated markdown is committed to git, so this build needs no database.

name: Wiki

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write

concurrency:
  group: "wiki"
  cancel-in-progress: true

env:
  ZOLA_VERSION: v0.23.6

jobs:
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # ratchet:github/codeql-action/init@v3
        with:
          languages: csharp, javascript-typescript
          build-mode: manual
          config-file: ./codeql-config.yml

      - name: Build generator (.NET)
        run: dotnet build generator/Perpetuum.WikiGenerate/Perpetuum.WikiGenerate.csproj -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # ratchet:github/codeql-action/analyze@v3

  build:
    name: Build (Zola)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4

      - name: Lint action pins (ratchet)
        uses: sethvargo/ratchet@main # ratchet:exclude
        with:
          files: .github/workflows/*.yml

      - name: Install Zola
        # The runner is non-root, so extract to the workspace, not /usr/local.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tools"
          curl -sSfL -o /tmp/zola.tar.gz "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzC "$GITHUB_WORKSPACE/tools" -f /tmp/zola.tar.gz
          # GITHUB_PATH applies from the next step on; export PATH for this step.
          export PATH="$GITHUB_WORKSPACE/tools:$PATH"
          echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"
          zola --version

      - name: Build
        # Zola 0.23 builds from the current directory (no -d flag); the
        # default working directory is the repo root where config.toml lives.
        run: zola build --force -o public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # ratchet:actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    # Deploys only from main (pull_request runs build-only, so PR checks
    # never touch the Pages environment).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # ratchet:actions/deploy-pages@v4
