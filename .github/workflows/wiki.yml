# Builds the Zola static site and deploys it to GitHub Pages.
# Generated markdown is committed to git, so this build needs no database.

name: Wiki

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  security-events: write

concurrency:
  group: "wiki"
  cancel-in-progress: true

env:
  ZOLA_VERSION: v0.23.6

jobs:
  ratchet:
    name: Ratchet (action pins)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4

      - name: Download ratchet (pinned release)
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/ratchet.tar.gz \
            "https://github.com/sethvargo/ratchet/releases/download/v0.12.0/ratchet_0.12.0_linux_amd64.tar.gz"
          echo "0d14cb829d3f5068454402f8198b0d9a29b776c8a070ef3f7e7bbb4f53d16aa15309f8e5042cbb3330b2d415b3c058ef269be946cc267098e2e4ad8a75fa1b5c  /tmp/ratchet.tar.gz" | sha512sum -c -
          tar xzC /tmp -f /tmp/ratchet.tar.gz

      - name: Lint pins
        run: /tmp/ratchet lint .github/workflows/wiki.yml

      - name: Check pins match their tags
        # Resolves the # ratchet: constraints and diffs against the committed
        # file: fails when a pinned SHA no longer matches its tag (tag moved
        # upstream or was re-pointed). Fix by running 'ratchet update' locally.
        run: |
          /tmp/ratchet update -out /tmp/wiki.updated.yml .github/workflows/wiki.yml
          if ! diff -u .github/workflows/wiki.yml /tmp/wiki.updated.yml; then
            echo "::error::Pinned action versions have drifted from their tags. Run 'ratchet update .github/workflows/wiki.yml' and commit the result."
            exit 1
          fi

  sast-csharp:
    name: SAST (CodeQL, C#)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # ratchet:github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
          config-file: ./codeql-config.yml

      - name: Build generator (.NET)
        run: dotnet build generator/Perpetuum.WikiGenerate/Perpetuum.WikiGenerate.csproj -c Release

      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # ratchet:github/codeql-action/analyze@v3

  sast-js:
    name: SAST (CodeQL, JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # ratchet:github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # ratchet:github/codeql-action/analyze@v3

  build:
    name: Build (Zola)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # ratchet:actions/checkout@v4

      - name: Install Zola
        # The runner is non-root, so extract to the workspace, not /usr/local.
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tools"
          curl -sSfL -o /tmp/zola.tar.gz "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzC "$GITHUB_WORKSPACE/tools" -f /tmp/zola.tar.gz
          # GITHUB_PATH applies from the next step on; export PATH for this step.
          export PATH="$GITHUB_WORKSPACE/tools:$PATH"
          echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"
          zola --version

      - name: Build
        # Zola 0.23 builds from the current directory (no -d flag); the
        # default working directory is the repo root where config.toml lives.
        run: zola build --force -o public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # ratchet:actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    # Deploys only from main (pull_request runs build-only, so PR checks
    # never touch the Pages environment).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # ratchet:actions/deploy-pages@v4
