# Builds the Zola static site and deploys it to GitHub Pages.
# Generated markdown is committed to git, so this build needs no database.

name: Wiki

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "wiki"
  cancel-in-progress: true

env:
  ZOLA_VERSION: v0.23.6

jobs:
  build:
    name: Build (Zola)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSfL -o /tmp/zola.tar.gz "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzC /usr/local -f /tmp/zola.tar.gz
          zola --version

      - name: Build
        run: zola build -d . -o "$GITHUB_WORKSPACE/public"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
